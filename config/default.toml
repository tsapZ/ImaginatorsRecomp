# Codegen fixes for default.xex (Skylanders: Imaginators, Xbox 360).
# Keys use the same schema as the manifest's [entrypoint] table.
# Every entry (or group of same-reason entries) needs a comment: what's at the address, how it was
# found, and why the fix is safe. Addresses from the other Skylanders projects (SwapForceRecomp,
# SSARecomp, GiantsRecomp) apply to their own executables only and are checked against this one.
#
# Entries are added as codegen and the runtime report them.

[functions]
# Function starts the analyzer put one instruction late. The first boot ended with "Call to invalid
# or unregistered function at guest address 0x82562CB8":
# a three-instruction setter (clrldi r11,r4,32; std r11,8(r3); blr) whose second instruction the
# analyzer had taken as the start, reached by a branch, while the real start is only in a pointer
# table. The same shape was searched in the whole code (a dump of guest memory with the input
# script's `save`, tools in the session notes): right after a `blr`, an instruction that is no known
# start, followed by one that is. Each is registered here; a start that was in fact the second half
# of the function before only splits it, which the generated code handles as a tail call. No sizes
# given, the analyzer finds the ends.

# Codegen fixes for default.xex (Skylanders: Imaginators, Xbox 360).
# Keys use the same schema as the manifest's [entrypoint] table.
# Every entry (or group of same-reason entries) needs a comment: what's at the address, how it was
# found, and why the fix is safe. Addresses from the other Skylanders projects (SwapForceRecomp,
# SSARecomp, GiantsRecomp) apply to their own executables only and are checked against this one.
#
# Entries are added as codegen and the runtime report them.

# 0x8329E248 is in BinkOpen (Bink 2), right after it reads the 44-byte movie header into r1+112
# (li r6,44; addi r5,r1,112; bctrl in sub_8329E078) and just before the signature compares
# (lis r11,0x6632 / ori 0x424B, "KB2f" and later). Found in the generated code by the same shape as
# SuperChargersRecomp's and TrapTeamRecomp's hooks. src/hooks/intro_skip_hook.cpp cuts the logo
# movies (skip_intro, on) and optionally the opening movie (skip_opening_movie, off) by setting
# their frame count to 1; other movies pass unchanged.
[[midasm_hook]]
address = 0x8329E248
name = "BinkHeaderLoaded"
registers = ["r1"]

# 0x832A04B8 is the start of BinkClose (the Bink 2 SDK's, the same code in all four later games):
# found as the one Bink call in the game's movie close (sub_8270DDA8), which clears the movie's
# handle right after it; that close is its only caller. With ultrawide active,
# src/hooks/ultrawide_hook.cpp turns the presenter's side bars it put up for the movie (at
# BinkOpen, see BinkHeaderLoaded) off again; it reads and changes no guest state.
[[midasm_hook]]
address = 0x832A04B8
name = "BinkCloseHook"
registers = []

# The scene size hooks (src/hooks/scene_size_hook.cpp; experimental, off unless scene_size is
# set): the same render code as SwapForceRecomp's, found in a dump of this game's code by the
# instructions at its four hooks, each with the same instructions around it.
# 0x826F96D0 is the start of the function that computes an igRenderTarget's size (r3): the
# only one reading its own _width / _height (+0x20 / +0x24) with the scales (+0x28 / +0x2C) nearby.
# The hook swaps in scene_size for a target that says 1040x620 (the 360 pipeline's mainScene).
[[midasm_hook]]
address = 0x826F96D0
name = "SceneSizeHook"
registers = ["r3"]

# 0x826FFBF4 follows lis r5,0x20: r5 = 0x200000 is the frame's EDRAM planning heap (2048 tiles
# of 1024 bytes) for its init call; with the SDK's 4096-tile EDRAM it gets that many. r5 is only
# that argument.
[[midasm_hook]]
address = 0x826FFBF4
name = "EdramHeapSizeHook"
registers = ["r5"]

# 0x82614420 is cmpwi cr6,r5,0x800: a render pass's EDRAM tiles against 2048, above which
# the game switches to predicated tiling (black scene in the SDK). r5 is lowered to 2048 when the
# pass fits into a 4096-tile EDRAM the SDK runs; r5 is not read on that path.
[[midasm_hook]]
address = 0x82614420
name = "EdramTilingHook"
registers = ["r5"]

# 0x826150B8 follows subfic r9,r11,0x800 in the per-pass EDRAM allocation: r9 = 2048 minus
# the depth surface's tiles (r11), stored two instructions on. With a 4096-tile EDRAM the depth goes
# to its top instead; r9 is only read by that store.
[[midasm_hook]]
address = 0x826150B8
name = "EdramDepthBaseHook"
registers = ["r9", "r11"]

# 0x827D1A6C is lfs f0,16(r11) in sub_827D1A28, where a UI (Juice) context's main screen sizes are
# read for drawing; r11 is the context (its reflection field _expectedScreenWidth at +0x28, then
# its height). Found as Swap Force's twin (the same branch between the main screen's +0x10 and the
# second one's +0x20); the fields in a snapshot of SuperChargers' contexts. With ultrawide_hud
# (on by default) and ultrawide_fov on a wider window, src/hooks/ultrawide_hook.cpp sets that
# width to the window's at the UI's height before it is read; otherwise it puts the game's own back.
[[midasm_hook]]
address = 0x827D1A6C
name = "UltrawideHudHook"
registers = ["r11"]

# 0x82BA84D0 is the call from the scene camera's per-frame set-up to the perspective builder
# sub_82547C30(r3 = projection matrix, f1 = horizontal FOV, f2 = vertical FOV, f3 = aspect, f4 =
# near, f5 = far; radians), as in SwapForceRecomp (hook UltrawideFovHook): the builder found by Swap
# Force's instructions, the call by a probe on all its callers (every frame, 16:9, the camera's
# FOV). src/hooks/ultrawide_hook.cpp widens f3 (and f1, keeping the vertical FOV) for a window wider
# than 16:9 with ultrawide_fov on; it only changes this call's arguments.
[[midasm_hook]]
address = 0x82BA84D0
name = "UltrawideFovHook"
registers = ["f1", "f2", "f3"]

# 0x8287A750 queues a D3D swap (the D3D library's code, found by Swap Force's instructions, 38 of
# its first 40 the same); r3 is the swap word, bits 8-11 the presentation interval (2 = 30 FPS
# here: 30.0 FPS with frame_rate_limit 60, 72.0 with 144). src/hooks/frame_rate_hook.cpp can
# override the interval (present_interval, off by default); it only changes r3 before it is read.
[[midasm_hook]]
address = 0x8287A750
name = "SwapIntervalHook"
registers = ["r3"]

# 0x8289D9F8 computes the FXAA sample offsets (CFxaaParametersAttr: quality / console / 360 rcp frame)
# from the frame size in f1 (width) and f2 (height), as SwapForceRecomp's sub_82B8E340 (found by its
# instructions, all 59 the same). src/hooks/fxaa_scale_hook.cpp multiplies f1/f2 by the draw
# resolution scale (fxaa_follow_resolution_scale, on) so the game's FXAA samples one host pixel
# apart at resolution_scale 2 and up; it only changes the two inputs of a function that writes
# nothing but the attr.
[[midasm_hook]]
address = 0x8289D9F8
name = "FxaaFrameSizeHook"
registers = ["f1", "f2"]

# 0x82A94FC0 is the last instruction of sub_82A92408 before its exit (loc_82A94FC4, which the
# early exit without blending jumps to as well). sub_82A92408 blends the level's environment
# settings (reflection field names at 0x820790B0, their offsets at 0x82079770) from the zone
# objects into the one at +2456 of its this, every field computed afresh from the sources; the
# instruction stores into that object through r11. _bloomScale is at +0x3A4. Found as
# SuperChargers' sub_82BD0C30 (the same lerps of the field) with the same field tables.
# src/hooks/post_effects_hook.cpp scales the blended _bloomScale by bloom_strength; it changes only
# that field of the result, after the function wrote it, and does nothing at 1.
[[midasm_hook]]
address = 0x82A94FC0
name = "BloomStrengthHook"
registers = ["r11"]

# 0x82A95A18 is where sub_82A94FC8's two paths join after the per-zone blend of _bloomScale
# (+0x3A4: the result at +2456 of r3 moved towards the zone r4's value by the weight at +2496,
# when the zone sets _blendAll (+110) or the field's state (+52)). Found next to the hook
# above: sub_82A94FC8 is the game's other blend of the environment fields. post_effects_hook.cpp adds
# the zone's share of the bloom_strength scale, so a zone with its own bloom keeps the setting;
# it reads r3 / r4 and writes only that field, and does nothing at 1.
[[midasm_hook]]
address = 0x82A95A18
name = "BloomStrengthZoneHook"
registers = ["r3", "r4"]

# 0x82899870 is the start of sub_82899870, which hands CMotionBlurMaterial's parameters to the shader
# each time the material is bound: ig_motion_blur_exposure_params from +96, the tile parameters
# from +112, ig_motion_blur_radius_params from +128. Found from the parameter names
# (0x82006E08..0x82006E44): sub_828A1D48 looks their handles up once (0x837DDB98 the exposure's),
# and this is the only function setting them per material, as SuperChargers' sub_8360C7E8.
# src/hooks/post_effects_hook.cpp writes the game's exposure times motion_blur_strength into +96 /
# +100 (remembering the game's value, so nothing compounds); only these two floats change, before
# the function reads them.
[[midasm_hook]]
address = 0x82899870
name = "MotionBlurStrengthHook"
registers = ["r3"]

# A shorter figure intro (figure_intro_seconds, as Swap Force's option; Swap Force #60).
# 0x829FF268 is fcmpu cr6,f0,f31 in sub_829FF1F0, which checks every frame whether a figure's
# intro time is up: f0 the time since it began (the magic moment's +232 counter), f31 its length
# (the tuning or the figure's own); when f0 is larger it fires an event on the figure and marks
# the time done (+554). Found as the function shaped like Swap Force's intro check (sub_829BFFF8:
# same done flag, length and time steps, same comparison). The hook only shortens f31, which the
# function saved and doesn't read after the comparison (src/hooks/figure_intro_hook.cpp).
[[midasm_hook]]
address = 0x829FF268
name = "FigureIntroLengthHook"
registers = ["f31"]

# That time check alone doesn't end the intro: sub_82A4BC28 (the magic moment's update in state 2)
# ends it once sub_82D90538 says the figure's intro animation is over, then sets the state (+68)
# to 4. 0x82A4C114 (one player) and 0x82A4BE58 (each figure with several) are the clrlwi
# r9,r3,24 right after those calls, r3 the answer, r27 the magic moment. Found 2026-10-22 with a
# write watch on the state during a scripted placement. The hook turns "not over" into "over"
# only once the intro ran figure_intro_seconds (0: never), so the game's own ending runs; r3 is
# read only by that clrlwi.
[[midasm_hook]]
address = 0x82A4C114
name = "FigureIntroEndHook"
registers = ["r3", "r27"]

[[midasm_hook]]
address = 0x82A4BE58
name = "FigureIntroEndHook"
registers = ["r3", "r27"]

# 0x82EEB308 is CPlayerJumpComponent's per-frame "stuck while falling" check, as SuperChargers'
# sub_82F949B8 and Swap Force's sub_82A4A828: a falling player who moved less than a distance since
# the last frame runs the stuck timer (+0xA0), and after CPlayerSystemData._stuckFallingTime
# (+0x64) is put back (sub_82EE35C0 with 5). The distance is the component's
# _stuckFallingDistanceOverride (+0x100) if set, else _stuckFallingDistanceThreshold (+0x60) times
# the component's +0x78. Found from the reflection field names and offset tables (0x820BA658 /
# 0x820B8030); the function reading the system data's +0x60 and +0x64 and the timer. The distance is
# per frame, i.e. tuned for 30 FPS. src/hooks/stuck_falling_hook.cpp scales it in f0 by 30 x dt (at
# most 1) at 0x82EEB3A8 (fmuls f0,f0,f0 squares it next; both paths meet there; nothing else reads
# f0 after it); dt is read from r25 + 0x14, the update context the only caller sub_82EEB628 keeps
# in r25 (its third argument; the function doesn't touch r25); f13, r30, r31 are only read, for
# the log. 0x82EEB3DC logs the put-back (f1 = the timer's time, f31 = the limit; only reads).
[[midasm_hook]]
address = 0x82EEB3A8
name = "StuckFallingThresholdHook"
registers = ["f0", "f13", "r25", "r30", "r31"]

[[midasm_hook]]
address = 0x82EEB3DC
name = "StuckFallingRespawnHook"
registers = ["f1", "f31"]

